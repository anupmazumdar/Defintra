name: Defintra CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Module Import Sweep
      run: |
        python -c "
        import importlib, pkgutil, defintra
        errors = []
        for finder, name, ispkg in pkgutil.walk_packages(defintra.__path__, defintra.__name__ + '.'):
            try:
                importlib.import_module(name)
            except Exception as e:
                errors.append((name, str(e)))
        if errors:
            print('Import failures detected:', errors)
            exit(1)
        print('All Defintra modules imported cleanly!')
        "

    - name: Run Ruff Linter Check
      run: |
        ruff check defintra tests

    - name: Run Test Suite
      run: |
        python -m pytest tests/ -v --cov=defintra --cov-report=term-missing

    - name: Validate CLI Execution & Governance Gate
      run: |
        python -m defintra --help
        defintra init "CI Test Project"
        defintra analyze "Build automated testing pipeline for web services"
        defintra status
        defintra compile "Test auth service" --role BACKEND_ENGINEER --target claude
        defintra export --out .defintra/ci_export
        defintra adr
        defintra schedule
        defintra contracts
        defintra staleness
        defintra advise
        defintra recover
        defintra snapshot --create v1.0.0
        defintra gate
